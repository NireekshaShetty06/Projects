<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Tic-Tac-Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scanlines"></div>
  <div class="container">
    <header>
      <div class="title-block">
        <span class="tag">// SYSTEM ONLINE</span>
        <h1>TIC<span class="accent">·</span>TAC<span class="accent">·</span>TOE</h1>
        <p class="subtitle">Human <span class="vs">VS</span> Machine Intelligence</p>
      </div>
    </header>

    <div class="hud">
      <div class="score-box">
        <div class="score-label">YOU</div>
        <div class="score-value" id="score-x">0</div>
      </div>
      <div class="status-center">
        <div class="status-ring">
          <div class="status-text" id="status">YOUR TURN</div>
        </div>
      </div>
      <div class="score-box right">
        <div class="score-label">A.I.</div>
        <div class="score-value" id="score-o">0</div>
      </div>
    </div>

    <div class="board-wrapper">
      <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
      <div class="win-line" id="win-line"></div>
    </div>

    <div class="controls">
      <button class="btn-restart" id="restart">
        <span class="btn-icon">↺</span> RESTART
      </button>
      <div class="mode-toggle">
        <span class="mode-label">AI MODE:</span>
        <button class="mode-btn active" id="mode-hard">HARD</button>
        <button class="mode-btn" id="mode-easy">EASY</button>
      </div>
    </div>

    <div class="result-overlay" id="result-overlay">
      <div class="result-box">
        <div class="result-icon" id="result-icon"></div>
        <div class="result-text" id="result-text"></div>
        <button class="btn-restart" id="play-again">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
